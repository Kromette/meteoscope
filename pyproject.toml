[project]
name = "meteoscope"
version = "0.1.0"
description = "Weather data pipeline and analytics project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
mypy_path = ["backend/src"]
strict = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]